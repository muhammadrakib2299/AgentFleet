[project]
name = "agentfleet-worker"
version = "0.1.0"
description = "AgentFleet execution plane: Celery workers running the LangGraph runtime"
requires-python = ">=3.13"
dependencies = [
    "agentfleet-core",
    "celery>=5.4",
    "redis>=5.2",
    "langgraph>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentfleet_worker"]
