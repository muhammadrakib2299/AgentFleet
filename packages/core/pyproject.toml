[project]
name = "agentfleet-core"
version = "0.1.0"
description = "Shared AgentFleet internals: settings, LLM provider abstraction, pricing"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.60",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentfleet_core"]
